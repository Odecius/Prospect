name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: abc_prospect_ci
          POSTGRES_USER: abc_prospect_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abc_prospect_ci -d abc_prospect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://abc_prospect_ci:ci-only-password@127.0.0.1:5432/abc_prospect_ci
      AI_DRAFTS_ENABLED: "false"
      OPENAI_API_KEY: ""
      GOOGLE_PLACES_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Validate migration round trip
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
